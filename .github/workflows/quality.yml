name: Leftly quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (default timezone)
        run: npm run test:run

      - name: Test (America/New_York)
        run: TZ=America/New_York npm run test:run

      - name: Test (America/Los_Angeles)
        run: TZ=America/Los_Angeles npm run test:run

      - name: Production build
        run: npm run build

      - name: Check for whitespace errors
        run: git diff --check
